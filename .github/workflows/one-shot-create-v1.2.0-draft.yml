name: One-shot create v1.2.0 draft release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-draft:
    if: github.event.head_commit.message == 'One-shot create v1.2.0 draft release'
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.2.0 draft release from v1.1.1
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: c805f0ede77340d4c151d94af1b57b76245a7c8b
        run: |
          set -euo pipefail
          EXISTING="$(gh api --paginate repos/${GITHUB_REPOSITORY}/releases --jq '.[] | select(.tag_name == "v1.2.0") | .id' | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "v1.2.0 release already exists: $EXISTING"
            exit 1
          fi
          BODY="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v1.1.1 --jq '.body // ""')"
          export BODY
          python - <<'PY'
          import json, os
          body = os.environ['BODY'].replace('\r\n','\n').replace('\r','\n').replace('v1.1.1','v1.2.0')
          payload = {
              'tag_name': 'v1.2.0',
              'target_commitish': os.environ['TARGET_SHA'],
              'name': 'EVE ghost enemies 한국어 패치 v1.2.0 (검수판)',
              'body': body,
              'draft': True,
              'prerelease': False,
          }
          with open('payload.json','w',encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          PY
          gh api --method POST repos/${GITHUB_REPOSITORY}/releases --input payload.json > created.json
          python - <<'PY'
          import json
          with open('created.json', encoding='utf-8') as f:
              r = json.load(f)
          assert r['tag_name'] == 'v1.2.0'
          assert r['name'] == 'EVE ghost enemies 한국어 패치 v1.2.0 (검수판)'
          assert r['draft'] is True
          assert r.get('assets') == []
          body = r.get('body') or ''
          assert '# EVE ghost enemies 한국어 패치 v1.2.0' in body
          assert 'EVE-Ghost-Enemies-KR-v1.2.0-Patcher' in body
          assert 'EVE-Ghost-Enemies-KR-v1.2.0-Switch-Android' in body
          assert '현재 Android 환경은 **Lenovo Legion Y700 3세대에서만 게임 실행을 확인**했습니다.' in body
          assert 'ANDROID_INSTALL_GUIDE_PAUSED_START' in body
          print(r['id'])
          print(r['html_url'])
          PY
