name: One-shot update Ghost Enemies v1.1.0 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot update Ghost Enemies v1.1.0 release'
    runs-on: ubuntu-latest
    steps:
      - name: Rename tag and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            # EVE ghost enemies 한국어 패치 v1.1.0

            ## v1.1.0 변경 사항

            - RomFS 기반 전용 패처로 배포 방식 변경
            - Windows용 self-contained GUI 패처 제공
            - 원본 및 패치 결과 파일 SHA-256 자동 검증
            - PC용 / Switch·Android용 결과물을 자동으로 분리 생성

            ## 지원 원본

            - Base Title ID: `01007BE0160D6000`
            - 본편 버전: `v0`
            - Update Title ID: `01007BE0160D6800`
            - 업데이트 버전: `v131072`
            - RomForge 표시 버전: `1.01`
            - 게임 내 표시 버전: `1.02`

            > [!NOTE]
            > 동일한 지원 업데이트가 **RomForge에서는 1.01**, 실제 게임 화면에서는 **1.02**로 표시됩니다.
            > 패치 기준은 게임 내 표시 버전 **1.02**입니다.

            **본편만 추출한 RomFS는 사용할 수 없습니다.**  
            반드시 **본편 + 지원 업데이트(RomForge 1.01 / 게임 내 1.02)가 함께 적용된 RomFS**가 필요합니다.

            ---

            ## 1. RomForge로 RomFS 준비

            > [!TIP]
            > **RomFS 덤프 방법을 이미 알고 계신다면, 아래 과정은 건너뛰셔도 됩니다.**

            RomForge를 실행한 뒤 아래 순서대로 진행합니다.

            1. 상단 메뉴에서 `Switch` → `리팩` → `파일`로 이동합니다.
            2. **EVE ghost enemies 본편 파일과 지원 업데이트 파일**을 RomForge 창으로 드래그합니다.
            3. 우측 하단의 **폴더 아이콘**을 눌러 Output 위치를 지정합니다.
            4. 하단의 **`언팩`** 버튼을 누릅니다.
            5. 언팩이 완료될 때까지 기다립니다.

            정상적으로 불러왔다면 RomForge에 아래 두 항목이 표시됩니다.

            - Base: `01007BE0160D6000` / `1.0.0`
            - Update: `01007BE0160D6800` / `1.01`

            > 게임 실행 후에는 업데이트 버전이 **1.02**로 표시됩니다.

            **반드시 본편과 지원 업데이트를 둘 다 추가한 상태에서 언팩하세요.**

            언팩이 완료되면 지정한 Output 위치에 아래 3개 폴더가 생성됩니다.

            ```text
            build_nca
            temp
            unpacked
            ```

            ---

            ## 2. 한국어 패치 적용

            1. 배포 ZIP을 완전히 압축 해제합니다.
            2. `EVE-Ghost-Enemies-KR-Patcher.exe`를 실행합니다.
            3. `[폴더 선택]`을 누릅니다.
            4. RomForge에서 언팩한 아래 `romfs` 폴더를 선택합니다.

            ```text
            unpacked\01007BE0160D6000\romfs
            ```

            5. 화면에 `패치를 시작할 수 있습니다.`가 표시되는지 확인합니다.
            6. `[한국어 패치 시작]`을 누릅니다.
            7. 원본 검증 → 패치 적용 → 결과 검증이 자동으로 진행됩니다.

            정상적으로 완료되면 `EVE-Ghost-Enemies-KR-v1.1.0-Patcher` 폴더 안에 아래 두 폴더가 생성됩니다.

            ```text
            EVE-Ghost-Enemies-KR-v1.1.0-Patcher
            ├─ EVE-Ghost-Enemies-KR-v1.1.0-PC
            └─ EVE-Ghost-Enemies-KR-v1.1.0-Switch-Android
            ```

            - `EVE-Ghost-Enemies-KR-v1.1.0-PC`
              - Eden Windows에서 사용

            - `EVE-Ghost-Enemies-KR-v1.1.0-Switch-Android`
              - Nintendo Switch 실기 및 Eden Android에서 사용

            ---

            ## 3. 적용 방법

            ### Eden Windows

            > [!TIP]
            > **권장 버전: Eden Windows v0.2.1 Standard**

            패치 완료 후 생성된 `EVE-Ghost-Enemies-KR-v1.1.0-PC` 폴더를 사용합니다.

            게임 우클릭 → `Open Mod Data Location`을 연 뒤 해당 패치 폴더를 적용합니다.

            게임 실행 중 튕김이나 프리징이 발생하면 **릴리즈에 함께 첨부한 Eden 설정 파일을 적용한 뒤 다시 실행**해 주세요.

            ---

            ### Eden Android Nightly

            **Eden Android Nightly 사용을 권장합니다.**

            패치 완료 후 생성된 `EVE-Ghost-Enemies-KR-v1.1.0-Switch-Android` 폴더를 사용합니다.

            게임 속성 → `Add-ons` → 설치 또는 `+` → `Mod`에서 해당 폴더를 선택합니다.

            Eden Android Nightly의 일반적인 내부 적용 위치:

            ```text
            /storage/emulated/0/Android/data/dev.eden.eden_emulator.nightly/files/load/
            └─ 01007BE0160D6000
               └─ EVE-Ghost-Enemies-KR
                  └─ romfs
                     └─ data_eve3
            ```

            게임 실행 중 튕김이나 프리징이 발생하면 **릴리즈에 함께 첨부한 Eden 설정 파일을 적용한 뒤 다시 실행**해 주세요.

            Android 11 이상에서는 직접 경로에 복사하는 것보다 Eden의 **Add-ons 설치 기능** 사용을 권장합니다.

            ---

            ### Switch 실기 — Atmosphere

            패치 완료 후 생성된 `EVE-Ghost-Enemies-KR-v1.1.0-Switch-Android` 폴더의 `romfs` 내용을 사용합니다.

            적용 위치:

            ```text
            SD카드
            └─ atmosphere
               └─ contents
                  └─ 01007BE0160D6000
                     └─ romfs
                        └─ data_eve3
            ```

            모드 폴더에는 반드시 Base Title ID `01007BE0160D6000`을 사용해야 합니다.

            Update Title ID `01007BE0160D6800`을 모드 상위 폴더로 사용하면 적용되지 않습니다.

            ---

            ## 다운로드 파일

            `EVE-Ghost-Enemies-KR-v1.1.0-Patcher.zip`

            ---

            ## 주의사항

            - 본인이 소유한 게임에서 직접 준비한 원본을 사용하세요.
            - 이미 다른 패치나 모드가 적용된 RomFS는 사용할 수 없습니다.
            - 기존 결과 폴더가 존재하면 패처가 덮어쓰지 않고 중단합니다.

            본 배포본에는 **게임 본편 및 원본 게임 데이터, 원본 RomFS, 키 파일 또는 완성 게임 파일이 포함되어 있지 않습니다.**
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          RELEASE_ID="379109959"
          OLD_TAG="v1.0.0-preview"
          NEW_TAG="v1.1.0"

          OLD_SHA="$(gh api "repos/${REPO}/git/ref/tags/${OLD_TAG}" --jq '.object.sha')"

          if ! gh api "repos/${REPO}/git/ref/tags/${NEW_TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${NEW_TAG}" \
              -f sha="${OLD_SHA}"
          fi

          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
            -f tag_name="${NEW_TAG}" \
            -f name="EVE ghost enemies 한국어 패치 v1.1.0 (검수판)" \
            -f body="${BODY}"

          test "$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq '.tag_name')" = "${NEW_TAG}"

          if gh api "repos/${REPO}/git/ref/tags/${OLD_TAG}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${REPO}/git/refs/tags/${OLD_TAG}"
          fi
