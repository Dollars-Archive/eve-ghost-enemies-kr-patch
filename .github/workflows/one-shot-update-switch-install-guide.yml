name: One-shot update Switch install guide

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot run Switch install guide v2'
    runs-on: ubuntu-latest
    steps:
      - name: Update Switch installation section in v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_B64: 
        run: |
          set -euo pipefail
          BODY="$(gh api repos/${GITHUB_REPOSITORY}/releases/379109959 --jq '.body // ""')"
          export BODY
          python -c "import os,json,base64; body=os.environ['BODY'].replace('\\r\\n','\\n').replace('\\r','\\n'); start=body.index('### Switch 실기 — Atmosphere'); end=body.index('\\n---\\n\\n## 다운로드 파일', start); new=base64.b64decode(os.environ['NEW_B64']).decode(); open('payload.json','w',encoding='utf-8').write(json.dumps({'body':body[:start]+new+body[end:]},ensure_ascii=False))"
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/379109959 --input payload.json
          VERIFY="$(gh api repos/${GITHUB_REPOSITORY}/releases/379109959 --jq '.body // ""')"
          printf '%s' "$VERIFY" | grep -F 'Switch 설치는 폴더 2개를 각각 다른 위치에 복사합니다'
          printf '%s' "$VERIFY" | grep -F '01007BE0160D6000  →  SD:/atmosphere/contents/'
          printf '%s' "$VERIFY" | grep -F 'atmosphere        →  SD:/'
          printf '%s' "$VERIFY" | grep -F '기존 폴더와 병합해서 복사'
          printf '%s' "$VERIFY" | grep -F '본체를 재부팅'
