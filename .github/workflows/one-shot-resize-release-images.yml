name: One-shot resize release images

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  resize-release-images:
    if: github.event.head_commit.message == 'One-shot resize release images to 80%'
    runs-on: ubuntu-latest
    steps:
      - name: Resize only large release images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '379109959'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          release_id = os.environ['RELEASE_ID']

          data = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/releases/{release_id}'],
              text=True,
          ))
          body = data.get('body') or ''

          img_re = re.compile(r'<img\b[^>]*>', re.IGNORECASE)
          width_re = re.compile(r'\bwidth\s*=\s*["\']?(\d+)(?:px)?["\']?', re.IGNORECASE)

          def resize(tag_match):
              tag = tag_match.group(0)
              width_match = width_re.search(tag)
              if not width_match or int(width_match.group(1)) < 800:
                  return tag

              tag = re.sub(
                  r'\bwidth\s*=\s*(["\']?)\d+(?:px)?\1',
                  'width="80%"',
                  tag,
                  count=1,
                  flags=re.IGNORECASE,
              )
              tag = re.sub(
                  r'\s+\bheight\s*=\s*(["\']?)\d+(?:px)?\1',
                  '',
                  tag,
                  count=1,
                  flags=re.IGNORECASE,
              )
              return tag

          new_body = img_re.sub(resize, body)
          if new_body == body:
              print('No large fixed-width images needed changes.')
          else:
              with open('payload.json', 'w', encoding='utf-8') as f:
                  json.dump({'body': new_body}, f, ensure_ascii=False)
              subprocess.run(
                  ['gh', 'api', '--method', 'PATCH', f'repos/{repo}/releases/{release_id}', '--input', 'payload.json'],
                  check=True,
              )

          verify = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/releases/{release_id}'],
              text=True,
          )).get('body') or ''

          remaining_large = []
          for m in img_re.finditer(verify):
              wm = width_re.search(m.group(0))
              if wm and int(wm.group(1)) >= 800:
                  remaining_large.append(m.group(0))

          if remaining_large:
              raise SystemExit('Large fixed-width images remain: ' + repr(remaining_large))
          print('Verified: large images are 80%; smaller fixed-width images were preserved.')
          PY
