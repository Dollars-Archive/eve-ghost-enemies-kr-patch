name: One-shot remove review label from v1.1.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot remove review label from v1.1.1'
    runs-on: ubuntu-latest
    steps:
      - name: Remove review label from release title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/379109959 -f name='EVE ghost enemies 한국어 패치 v1.1.1' > updated.json
          python -c "import json; r=json.load(open('updated.json',encoding='utf-8')); assert r['name']=='EVE ghost enemies 한국어 패치 v1.1.1'; print('verified')"
