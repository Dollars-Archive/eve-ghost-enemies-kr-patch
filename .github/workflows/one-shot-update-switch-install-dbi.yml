name: One-shot fix DBI typo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-typo:
    if: github.event.head_commit.message == 'One-shot fix DBI typo'
    runs-on: ubuntu-latest
    steps:
      - name: Fix typo in INSTALL.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > file.json
          python - <<'PY'
          import base64, json
          data=json.load(open('file.json',encoding='utf-8'))
          text=base64.b64decode(data['content']).decode('utf-8')
          assert '남앀 있다면' in text
          text=text.replace('남앀 있다면','남아 있다면',1)
          payload={'message':'docs: fix DBI MTP typo','content':base64.b64encode(text.encode('utf-8')).decode('ascii'),'sha':data['sha']}
          json.dump(payload,open('payload.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/INSTALL.md --input payload.json > updated.json
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > verify.json
          python - <<'PY'
          import base64,json
          data=json.load(open('verify.json',encoding='utf-8'))
          text=base64.b64decode(data['content']).decode('utf-8')
          assert '남앀' not in text
          assert '남아 있다면' in text
          print(data['sha'])
          PY
