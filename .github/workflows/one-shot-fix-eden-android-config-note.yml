name: One-shot fix Eden Android config note

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot fix Eden Android config note'
    runs-on: ubuntu-latest
    steps:
      - name: Fix Eden config note placement and filename
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess

          repo = 'Dollars-Archive/eve-ghost-enemies-kr-patch'
          release_id = '379109959'
          old = '게임 실행 중 튕김이나 프리징이 발생하면 **릴리즈에 함께 첨부한 Eden 설정 파일을 적용한 뒤 다시 실행**해 주세요.'
          new = '게임 실행 중 튕김이나 프리징이 발생하면 **릴리즈에 함께 첨부한 Android용 Eden 설정 파일 `01007BE0160D6000.ini`를 적용한 뒤 다시 실행**해 주세요.'

          data = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{release_id}'], text=True))
          body = (data.get('body') or '').replace('\r\n','\n').replace('\r','\n')

          w_start = body.index('### Eden Windows')
          w_end = body.index('### Eden Android Nightly')
          before = body[:w_start]
          windows = body[w_start:w_end]
          rest = body[w_end:]
          if old not in windows:
              raise SystemExit('Windows config note not found')
          windows = windows.replace(old + '\n\n', '', 1)

          a_end = rest.index('### Switch 실기')
          android = rest[:a_end]
          after = rest[a_end:]
          if old not in android:
              raise SystemExit('Android config note not found')
          android = android.replace(old, new, 1)

          new_body = before + windows + android + after
          with open('payload.json','w',encoding='utf-8') as f:
              json.dump({'body':new_body}, f, ensure_ascii=False)
          subprocess.run(['gh','api','--method','PATCH',f'repos/{repo}/releases/{release_id}','--input','payload.json'], check=True)

          verify = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{release_id}'], text=True)).get('body') or ''
          vw = verify[verify.index('### Eden Windows'):verify.index('### Eden Android Nightly')]
          va = verify[verify.index('### Eden Android Nightly'):verify.index('### Switch 실기')]
          if old in vw or new not in va:
              raise SystemExit('Verification failed')
          print('Verified: Windows note removed; Android note names 01007BE0160D6000.ini.')
          PY
