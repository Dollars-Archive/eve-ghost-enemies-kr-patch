name: One-shot pause v1.1.1 distribution

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot pause v1.1.1 distribution'
    runs-on: ubuntu-latest
    steps:
      - name: Add distribution pause warning to v1.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX_B64: 
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/releases/379109959 > release.json
          python -c "import os,base64,json; r=json.load(open('release.json',encoding='utf-8')); body=(r.get('body') or '').replace('\\r\\n','\\n').replace('\\r','\\n'); marker='<!-- DISTRIBUTION_PAUSED_SAVE_PREVIEW_BUG -->'; prefix=base64.b64decode(os.environ['PREFIX_B64']).decode('utf-8'); newbody=body if marker in body else prefix+body; open('payload.json','w',encoding='utf-8').write(json.dumps({'body':newbody},ensure_ascii=False))"
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/379109959 --input payload.json > updated.json
          python -c "import json; r=json.load(open('updated.json',encoding='utf-8')); b=r.get('body') or ''; assert b.startswith('<!-- DISTRIBUTION_PAUSED_SAVE_PREVIEW_BUG -->'); assert '현재 배포를 일시 중단합니다' in b; assert 'Issue #8' in b; print('verified')"
