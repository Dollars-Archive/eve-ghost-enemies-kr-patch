name: One-shot adjust Switch reboot note

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot adjust Switch reboot note v2'
    runs-on: ubuntu-latest
    steps:
      - name: Update Switch reboot guidance in v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_B64: IyMjIDPri6jqs4Qg4oCUIOyerOu2gO2MhQoK65GQIO2PtOuNlOulvCDrqqjrkZAg67O17IKs7ZaI7Jy866m0IFNE7Lm065Oc66W8IFN3aXRjaOyXkCDrhKPqs6AgKirrs7jssrTrpbwg7J6s67aA7YyFKirtlanri4jri6QuCg==
          NEW_B64: 
        run: |
          set -euo pipefail
          BODY="$(gh api repos/${GITHUB_REPOSITORY}/releases/379109959 --jq '.body // ""')"
          export BODY
          python -c "import os,base64,json; body=os.environ['BODY'].replace('\\r\\n','\\n').replace('\\r','\\n'); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in body, 'target block not found'; open('payload.json','w',encoding='utf-8').write(json.dumps({'body':body.replace(old,new,1)},ensure_ascii=False))"
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/379109959 --input payload.json
          VERIFY="$(gh api repos/${GITHUB_REPOSITORY}/releases/379109959 --jq '.body // ""')"
          printf '%s' "$VERIFY" | grep -F '### 3단계 — 한글패치 적용 여부 확인'
          printf '%s' "$VERIFY" | grep -F '먼저 재부팅하지 말고 게임을 실행해서 한글패치가 적용됐는지 확인'
          printf '%s' "$VERIFY" | grep -F '추가 재부팅 없이 그대로 사용하면 됩니다'
          printf '%s' "$VERIFY" | grep -F '경우에만 **Switch 본체를 재부팅한 뒤 다시 실행**'
