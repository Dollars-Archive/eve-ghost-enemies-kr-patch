name: One-shot fix PC install folder v1.2.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-install:
    if: github.event.head_commit.message == 'One-shot fix PC install folder v1.2.0 v2'
    runs-on: ubuntu-latest
    steps:
      - name: Replace PC installation section
        env:
          GH_TOKEN: ${{ github.token }}
          SECTION_B64: 
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > file.json
          python - <<'PY'
          import base64, json, os
          data = json.load(open('file.json', encoding='utf-8'))
          text = base64.b64decode(data['content']).decode('utf-8')
          start = text.index('# 4. PC 적용 방법')
          end = text.index('---\n\n# 5. Android 적용 방법', start)
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          text = text[:start] + section + '\n\n' + text[end:]
          old = '5. PC에서는 게임 모드 위치 바로 아래에 `exefs`와 `romfs`가 있는지 확인'
          new = '5. PC에서는 `Open Mod Data Location`으로 열린 `01007BE0160D6000` 폴더 안에 **`EVE-Ghost-Enemies-KR-v1.2.0-PC` 폴더 자체가 들어가 있는지 확인**'
          assert old in text
          text = text.replace(old, new, 1)
          payload = {
              'message': 'docs: fix Eden PC mod folder installation path',
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'sha': data['sha'],
          }
          json.dump(payload, open('payload.json','w',encoding='utf-8'), ensure_ascii=False)
          PY
          gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/INSTALL.md --input payload.json > updated.json
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > verify.json
          python - <<'PY'
          import base64, json
          data = json.load(open('verify.json', encoding='utf-8'))
          text = base64.b64decode(data['content']).decode('utf-8')
          assert 'EVE-Ghost-Enemies-KR-v1.2.0-PC` 폴더 자체를 통째로 복사' in text
          assert '`exefs`와 `romfs`만 꺼내서 `01007BE0160D6000` 바로 아래에 넣는 것이 아닙니다.' in text
          assert 'PC에서는 `Open Mod Data Location`으로 열린 `01007BE0160D6000` 폴더 안에' in text
          print(data['sha'])
          PY