name: One-shot restore Android custom settings guidance v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-install:
    if: github.event.head_commit.message == 'One-shot restore Android custom settings guidance v2'
    runs-on: ubuntu-latest
    steps:
      - name: Restore Android Custom Settings instructions
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SECTION_B64: 
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > file.json
          python -c "import os,base64,json; d=json.load(open('file.json',encoding='utf-8')); t=base64.b64decode(d['content']).decode('utf-8'); s=t.index('### Custom Settings 관련'); e=t.index('\n\n---',s); n=base64.b64decode(os.environ['NEW_SECTION_B64']).decode('utf-8'); out=t[:s]+n+t[e:]; p={'message':'docs: restore Android Custom Settings requirement','content':base64.b64encode(out.encode('utf-8')).decode('ascii'),'sha':d['sha']}; json.dump(p,open('payload.json','w',encoding='utf-8'),ensure_ascii=False)"
          gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/INSTALL.md --input payload.json > updated.json
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > verify.json
          python -c "import base64,json; d=json.load(open('verify.json',encoding='utf-8')); t=base64.b64decode(d['content']).decode('utf-8'); assert 'v1.2.0에서도 기존과 동일하게 Android용 Custom Settings를 적용해 주세요.' in t; assert '01007BE0160D6000.ini' in t; assert '구버전용 안내' not in t; print(d['sha'])"
